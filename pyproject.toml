[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-grounding"
version = "0.1.0"
description = "Deterministic numeric-grounding scorer for Inspect AI: flags numbers in model output that are not in the evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yanheng Li" }]
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.289"]
keywords = ["inspect-ai", "evals", "llm", "hallucination", "grounding", "scorer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Chris316-git/inspect-grounding"
Issues = "https://github.com/Chris316-git/inspect-grounding/issues"

[project.entry-points.inspect_ai]
inspect_grounding = "inspect_grounding._registry"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_grounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
